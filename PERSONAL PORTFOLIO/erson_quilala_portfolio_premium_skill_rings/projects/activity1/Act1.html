<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Future Web Developer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <div class="box" id="box1">
      <div class="profile-ring">
        <img src="Image1.png" id="Img1" alt="Profile">
      </div>

      <p class="eyebrow">INTERACTIVE PROFILE</p>
      <h1 id="name">Future Web Developer</h1>
      <p class="course">BS Computer Science</p>

      <label class="field-label" for="nickname">Nickname</label>
      <input type="text" id="nickname" placeholder="Type your nickname">

      <label class="field-label" for="year">Year Level</label>
      <select id="year">
        <option>Select Year</option>
        <option>1st Year</option>
        <option>2nd Year</option>
        <option>3rd Year</option>
        <option>4th Year</option>
      </select>

      <div class="button-row">
        <button id="click" type="button">Click</button>
        <button id="double" type="button">Double Click</button>
        <button id="hold" type="button">Press &amp; Hold</button>
      </div>

      <div class="status-panel">
        <p id="message1">Waiting for interaction.....</p>
        <p id="message">Welcome Back!</p>
      </div>
    </div>
  </main>

  <script src="ScriptAct1.js"></script>
</body>
</html>
