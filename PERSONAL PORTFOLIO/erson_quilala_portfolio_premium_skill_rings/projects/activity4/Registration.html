<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-title"><span class="site-mark">EQ</span><h2>My Personal website</h2></div>
    <nav>
      <a href="Home.html">Home</a>
      <a class="active" href="Registration.html">Registration</a>
      <a href="Grades.html">Grades</a>
      <a href="Profile.html">Profile</a>
    </nav>
  </header>

  <main class="page-shell">
    <form class="content-card form-card" id="activity4Form">
      <p class="eyebrow">REGISTRATION</p>
      <h1>Student Registration Form</h1>

      <label class="field"><span>Student Name</span><input type="text" placeholder="Enter Name" required></label>
      <label class="field"><span>Email</span><input type="email" placeholder="Enter Email" required></label>
      <label class="field"><span>Password</span><input type="password" placeholder="Enter Password" required></label>

      <fieldset>
        <legend>Gender</legend>
        <div class="choice-row"><label><input type="radio" name="gender"> Male</label><label><input type="radio" name="gender"> Female</label></div>
      </fieldset>

      <label class="field"><span>Course</span><select><option>Select Course</option><option>BSCS</option><option>BSIT</option><option>BSIS</option></select></label>

      <fieldset>
        <legend>Skills</legend>
        <div class="choice-row"><label><input type="checkbox"> HTML</label><label><input type="checkbox"> CSS</label><label><input type="checkbox"> JavaScript</label></div>
      </fieldset>

      <label class="field"><span>Profile Picture</span><input type="file" id="act4File"><small id="act4FileName"></small></label>
      <label class="field"><span>Address</span><textarea></textarea></label>

      <div class="form-actions"><button type="submit">Submit</button><button type="reset" class="secondary">Reset</button></div>
      <p class="form-message" id="act4Message" aria-live="polite"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
